# release/* と develop の push で Cloudflare Workers へデプロイする。`e2e.yaml` を `workflow_call` で呼び出す。
#
# - release/*: 本番の Worker（skyshare、SITE_HOST のドメイン）
# - develop: develop 用の別の Worker（skyshare-develop、develop.<SITE_HOST>）。Cron が動く確認用の環境で、
#   D1・R2 も develop 専用。dev/* のプレビュー（preview.yaml）はこの Worker に作られる
#
# verify と e2e の両ジョブが成功した場合だけデプロイする。verify は unit・component・route・render と型検査を実行し、E2E は e2e ジョブで実行する。
# 必要な設定は docs/DEVELOP.md の「CI/CD（GitHub Actions）」を参照。
# - Secrets:   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# - Variables: PUBLIC_LEGACY_BACKEND_ENDPOINT / PUBLIC_DEFAULT_ATP_SERVICE / PUBLIC_NODE_ENV /
#              PUBLIC_OGP_EXTRACTOR_API / PUBLIC_PLC_DIRECTORY_BASE_URL と、運用者ごとの設定（docs/DEVELOP.md）
# 手動実行で `dry_run` が true の場合はビルドと wrangler の検証だけを行い、公開しない。
name: deploy

on:
  push:
    branches: ["release/**", develop]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "デプロイせずビルドと検証のみ行う"
        type: boolean
        default: true

# 同じ配備先へのデプロイを直列化し、別の release ブランチが本番を同時更新しないようにする。
concurrency:
  group: deploy-${{ github.ref_name == 'develop' && 'develop' || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUBLIC_LEGACY_BACKEND_ENDPOINT: ${{ vars.PUBLIC_LEGACY_BACKEND_ENDPOINT }}
  PUBLIC_DEFAULT_ATP_SERVICE: ${{ vars.PUBLIC_DEFAULT_ATP_SERVICE }}
  PUBLIC_NODE_ENV: ${{ vars.PUBLIC_NODE_ENV }}
  PUBLIC_OGP_EXTRACTOR_API: ${{ vars.PUBLIC_OGP_EXTRACTOR_API }}
  PUBLIC_PLC_DIRECTORY_BASE_URL: ${{ vars.PUBLIC_PLC_DIRECTORY_BASE_URL }}
  # 運用者ごとの設定（docs/DEVELOP.md の「運用者ごとの設定」）
  SITE_HOST: ${{ vars.SITE_HOST }}
  PUBLIC_OPERATOR_NAME: ${{ vars.PUBLIC_OPERATOR_NAME }}
  PUBLIC_OPERATOR_EMAIL: ${{ vars.PUBLIC_OPERATOR_EMAIL }}
  PUBLIC_OPERATOR_BLUESKY_HANDLE: ${{ vars.PUBLIC_OPERATOR_BLUESKY_HANDLE }}
  PUBLIC_PRIVACY_ENACTED_AT: ${{ vars.PUBLIC_PRIVACY_ENACTED_AT }}
  PUBLIC_PRIVACY_REVISED_AT: ${{ vars.PUBLIC_PRIVACY_REVISED_AT }}
  PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}

jobs:
  # テストと型検査。失敗した場合はデプロイしない。
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # lexicons/com/atproto/repo/strongRef.json は atproto サブモジュールへのシンボリックリンク。
          submodules: true
      - uses: actions/setup-node@v4
        with:
          # Cloudflare Workers が扱える Node.js のバージョンを指定する。
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      # 型検査とテストが使う src/client の atproto / openapi 生成コードを作る。
      - run: npm run codegen
      - run: npm run test:type
      # unit・component・route・render を実行する。E2E は呼び出した e2e ジョブが担う。
      - run: npm run test:unit
      - run: npm run test:component
      - run: npm run test:route
      - run: npm run test:render
      # 層の向き・循環・領域をまたぐ import を検査し、許容リストに無い違反で失敗する。
      - run: npm run test:imports
      # lexicon の lint。導入前に配布物のチェックサムを検証する。
      - name: Run goat lint
        env:
          GOAT_VERSION: 0.2.5
        run: |
          curl -fsSLO "https://github.com/bluesky-social/goat/releases/download/v${GOAT_VERSION}/goat_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/bluesky-social/goat/releases/download/v${GOAT_VERSION}/goat_${GOAT_VERSION}_checksums.txt"
          grep ' goat_Linux_x86_64.tar.gz$' "goat_${GOAT_VERSION}_checksums.txt" | sha256sum -c -
          sudo tar -xf goat_Linux_x86_64.tar.gz -C /usr/local/bin goat
          goat --version
      - run: npm run test:lexicon

  # E2E（複数ブラウザ。実アカウントの live 層は含まない）。失敗した場合はデプロイしない。
  e2e:
    uses: ./.github/workflows/e2e.yaml
    secrets: inherit

  deploy:
    needs: [verify, e2e]
    # 手動実行で別のブランチが選ばれても、本番や develop 環境へ配備しない。
    if: startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      # scripts/config/render-deploy-config.mjs が使う外部 branch-release-workflow プラグインを取得する。
      # 秘密情報を扱うため、取得元（.branch-release-workflow-source.json）で指定されたブランチの最新コミットを使う。
      - name: Fetch branch-release-workflow
        run: |
          brw_dir="$(node scripts/agent/setup-brw.mjs)"
          echo "BRW_PLUGIN_DIR=$brw_dir" >> "$GITHUB_ENV"
      # Git 管理外の wrangler.jsonc と _legacy/frontend/.env.production を Variables から生成する。
      # develop では専用 Worker を使い、D1 の ID を名前から解決するため Cloudflare 認証情報を渡す。
      - name: Configure build setting
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_FLAG: ${{ github.ref_name == 'develop' && '--develop' || '' }}
        run: node scripts/config/render-deploy-config.mjs $TARGET_FLAG
      # SURVEY_CONFIG は設定生成に使うビルドだけに渡し、生成失敗時はデプロイを止める。
      # サイト URL（共有リンクなど）は生成した wrangler.jsonc の設定から決まる。
      - name: Run build
        env:
          SURVEY_CONFIG: ${{ vars.SURVEY_CONFIG }}
        run: npm run build
      - name: Dry run cloudflare deploy
        run: npx wrangler deploy --dry-run
      # 対象環境の D1 に未適用のマイグレーションを適用する（適用済みのものは再実行されない）。
      - name: Apply D1 migrations
        if: ${{ hashFiles('migrations/*.sql') != '' && (github.event_name == 'push' || inputs.dry_run == false) }}
        run: npx wrangler d1 migrations apply DB --remote -c dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy cloudflare worker
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Worker（develop ではプレビューの基本設定も）に未登録のシークレットを生成して登録する。
      # 登録済みの値は上書きしない。初回の配備で Worker を作成してから登録する。
      - name: Ensure worker secrets
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: node scripts/secrets/ensure-worker-secrets.mjs $TARGET_FLAG
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_FLAG: ${{ github.ref_name == 'develop' && '--develop' || '' }}
