# main と develop への push をトリガーに、Cloudflare Workers へ自動デプロイする。
#
# - main: 本番の Worker（skyshare、SITE_HOST のドメイン）
# - develop: develop 用の別の Worker（skyshare-develop、develop.<SITE_HOST>）。Cron が動く確認用の環境で、
#   D1・R2 も develop 専用。dev/* のプレビュー（preview.yaml）はこの Worker に作られる
#
# verify（テスト・型検査）と e2e（Playwright）の両方に成功した場合のみデプロイする。
# 必要な設定は DEVELOP.md の「CI/CD（GitHub Actions）」を参照。
# - Secrets:   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# - Variables: PUBLIC_LEGACY_BACKEND_ENDPOINT / PUBLIC_DEFAULT_ATP_SERVICE / PUBLIC_NODE_ENV /
#              PUBLIC_OGP_EXTRACTOR_API / PUBLIC_PLC_DIRECTORY_BASE_URL と、運用者ごとの設定（DEVELOP.md）
# 手動実行（workflow_dispatch）で dry_run を true にすると、ビルドと wrangler の検証のみ行い、公開はしない。
name: deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "デプロイせずビルドと検証のみ行う"
        type: boolean
        default: true

# 同一ブランチのデプロイが同時に走らないようにする。デプロイ中の処理は中断せず、後続を待たせる
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUBLIC_LEGACY_BACKEND_ENDPOINT: ${{ vars.PUBLIC_LEGACY_BACKEND_ENDPOINT }}
  PUBLIC_DEFAULT_ATP_SERVICE: ${{ vars.PUBLIC_DEFAULT_ATP_SERVICE }}
  PUBLIC_NODE_ENV: ${{ vars.PUBLIC_NODE_ENV }}
  PUBLIC_OGP_EXTRACTOR_API: ${{ vars.PUBLIC_OGP_EXTRACTOR_API }}
  PUBLIC_PLC_DIRECTORY_BASE_URL: ${{ vars.PUBLIC_PLC_DIRECTORY_BASE_URL }}
  # 運用者ごとの設定（DEVELOP.md の「運用者ごとの設定」）
  SITE_HOST: ${{ vars.SITE_HOST }}
  PUBLIC_OPERATOR_NAME: ${{ vars.PUBLIC_OPERATOR_NAME }}
  PUBLIC_OPERATOR_EMAIL: ${{ vars.PUBLIC_OPERATOR_EMAIL }}
  PUBLIC_OPERATOR_BLUESKY_HANDLE: ${{ vars.PUBLIC_OPERATOR_BLUESKY_HANDLE }}
  PUBLIC_PRIVACY_ENACTED_AT: ${{ vars.PUBLIC_PRIVACY_ENACTED_AT }}
  PUBLIC_PRIVACY_REVISED_AT: ${{ vars.PUBLIC_PRIVACY_REVISED_AT }}
  PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}

jobs:
  # テストと型検査。失敗した場合はデプロイしない
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # lexicons/com/atproto/repo/strongRef.json が atproto サブモジュールへのシンボリックリンクのため必要
          submodules: true
      - uses: actions/setup-node@v4
        with:
          # Cloudflare Workers が扱える Node.js の最新バージョンに固定（CLAUDE.md 参照）
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      # src/client 配下の生成コード（atproto / openapi）を作る。型検査とテストの前提
      - run: npm run codegen
      - run: npm run test:type
      # 単体テスト（tests/hack/renderDeployConfig.test.ts）が使う branch-release-workflow プラグインを取得する。
      # deploy ジョブと同じコミットに固定する（更新時は両方の BRW_REF を書き換える）
      - name: Fetch branch-release-workflow
        env:
          BRW_REF: 4549dc157056b63d2aff95e64f60a47af1ca55d2
        run: |
          git init -q "$RUNNER_TEMP/brw"
          git -C "$RUNNER_TEMP/brw" fetch -q --depth 1 https://github.com/nekono-dev/branch-release-workflow.git "$BRW_REF"
          git -C "$RUNNER_TEMP/brw" checkout -q FETCH_HEAD
          echo "BRW_PLUGIN_DIR=$RUNNER_TEMP/brw" >> "$GITHUB_ENV"
      - run: npm run test:unit
      - run: npm run test:astro
      # 仕様書（.kiro/specs・.kiro/steering）と設計資料（docs）の整形を、プロジェクトの prettier プラグイン（.prettierrc）で検査する
      - name: Check spec docs format
        run: npm run test:docs
      # lexicon の lint（goat）。リリースのチェックサムを検証してから導入する
      - name: Run goat lint
        env:
          GOAT_VERSION: 0.2.5
        run: |
          curl -fsSLO "https://github.com/bluesky-social/goat/releases/download/v${GOAT_VERSION}/goat_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/bluesky-social/goat/releases/download/v${GOAT_VERSION}/goat_${GOAT_VERSION}_checksums.txt"
          grep ' goat_Linux_x86_64.tar.gz$' "goat_${GOAT_VERSION}_checksums.txt" | sha256sum -c -
          sudo tar -xf goat_Linux_x86_64.tar.gz -C /usr/local/bin goat
          goat --version
      - run: npm run test:lexicon

  # E2E（ライブテスト・他ブラウザを含む）。失敗した場合はデプロイしない
  e2e:
    uses: ./.github/workflows/e2e.yaml
    secrets: inherit

  deploy:
    needs: [verify, e2e]
    # 手動実行で他のブランチを選んでも、本番や develop 環境へ配備しない
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      # hack/render-deploy-config.mjs が使う branch-release-workflow プラグイン（リポジトリに同梱しない）を取得する。
      # 秘密情報を扱うジョブで実行するため、検証済みのコミットに固定する（更新時は BRW_REF を書き換える）
      - name: Fetch branch-release-workflow
        env:
          BRW_REF: 4549dc157056b63d2aff95e64f60a47af1ca55d2
        run: |
          git init -q "$RUNNER_TEMP/brw"
          git -C "$RUNNER_TEMP/brw" fetch -q --depth 1 https://github.com/nekono-dev/branch-release-workflow.git "$BRW_REF"
          git -C "$RUNNER_TEMP/brw" checkout -q FETCH_HEAD
          echo "BRW_PLUGIN_DIR=$RUNNER_TEMP/brw" >> "$GITHUB_ENV"
      # wrangler.jsonc と _legacy/frontend/.env.production は .gitignore 対象のため、Variables から生成する
      # develop へは develop 用の Worker として配備する（D1 の ID を名前から引くため Cloudflare の認証情報を渡す）
      - name: Configure build setting
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_FLAG: ${{ github.ref_name == 'develop' && '--develop' || '' }}
        run: node hack/render-deploy-config.mjs $TARGET_FLAG
      # サイトの URL（共有リンクなど）を配備先のドメインにする。
      # アンケートの設定の元の変数（SURVEY_CONFIG）はビルドにだけ渡す。生成に失敗するとビルドごと止まり、配備には進まない
      - name: Run build
        env:
          SURVEY_CONFIG: ${{ vars.SURVEY_CONFIG }}
          SITE_HOST: ${{ github.ref_name == 'develop' && format('develop.{0}', vars.SITE_HOST) || vars.SITE_HOST }}
        run: npm run build
      - name: Dry run cloudflare deploy
        run: npx wrangler deploy --dry-run
      # 配備先の D1（main は本番、develop は develop 用）に、未適用のマイグレーションを適用する（適用済みのものは再実行されない）
      - name: Apply D1 migrations
        if: ${{ hashFiles('migrations/*.sql') != '' && (github.event_name == 'push' || inputs.dry_run == false) }}
        run: npx wrangler d1 migrations apply DB --remote -c dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy cloudflare worker
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 配備先の Worker（develop ではプレビューの基本設定も）に、未登録のシークレット（OAUTH_CLIENT_KEY など）を生成して登録する。
      # 登録済みの値は上書きしない。初回の配備で Worker ができてから登録できるよう、配備の後に行う
      - name: Ensure worker secrets
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: node hack/ensure-worker-secrets.mjs $TARGET_FLAG
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_FLAG: ${{ github.ref_name == 'develop' && '--develop' || '' }}
