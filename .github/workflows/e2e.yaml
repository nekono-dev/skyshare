# フロントエンドのE2E（Playwright）を実行する。deploy.yaml から呼び出され（workflow_call）、成功した場合のみデプロイされる。
# 単体でも手動実行（workflow_dispatch）できる。
#
# - Secret `E2E_ENV` に、リポジトリ直下の `.env.e2e` の中身（KEY=value 形式、複数行）をそのまま登録する。
#   登録があれば実アカウントのライブテストも実行し、無ければゲスト表示のE2Eだけを実行する。
# - Variables は deploy.yaml と共通（DEVELOP.md の「CI/CD（GitHub Actions）」を参照）。
# - 実行対象ブラウザ: chromium（ライブテスト含む）/ firefox / webkit / webkit-iphone
name: e2e

on:
  workflow_call:
  workflow_dispatch:

# 同じ検証用アカウントへ同時に投稿・削除しないよう直列化する。実行中のテストは中断せず後続を待たせる
concurrency:
  group: e2e-live-account
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUBLIC_LEGACY_BACKEND_ENDPOINT: ${{ vars.PUBLIC_LEGACY_BACKEND_ENDPOINT }}
  PUBLIC_DEFAULT_ATP_SERVICE: ${{ vars.PUBLIC_DEFAULT_ATP_SERVICE }}
  PUBLIC_NODE_ENV: ${{ vars.PUBLIC_NODE_ENV }}
  PUBLIC_OGP_EXTRACTOR_API: ${{ vars.PUBLIC_OGP_EXTRACTOR_API }}
  PUBLIC_PLC_DIRECTORY_BASE_URL: ${{ vars.PUBLIC_PLC_DIRECTORY_BASE_URL }}
  # 運用者ごとの設定（DEVELOP.md の「運用者ごとの設定」）
  SITE_HOST: ${{ vars.SITE_HOST }}
  PUBLIC_OPERATOR_NAME: ${{ vars.PUBLIC_OPERATOR_NAME }}
  PUBLIC_OPERATOR_EMAIL: ${{ vars.PUBLIC_OPERATOR_EMAIL }}
  PUBLIC_OPERATOR_BLUESKY_HANDLE: ${{ vars.PUBLIC_OPERATOR_BLUESKY_HANDLE }}
  PUBLIC_PRIVACY_ENACTED_AT: ${{ vars.PUBLIC_PRIVACY_ENACTED_AT }}
  PUBLIC_PRIVACY_REVISED_AT: ${{ vars.PUBLIC_PRIVACY_REVISED_AT }}
  PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # lexicons/com/atproto/repo/strongRef.json が atproto サブモジュールへのシンボリックリンクのため必要
          submodules: true
      - uses: actions/setup-node@v4
        with:
          # Cloudflare Workers が扱える Node.js の最新バージョンに固定（AGENTS.md 参照）
          node-version: 22.16.0
          cache: npm
      - run: npm ci

      # OS のパッケージ（日本語・国旗絵文字のフォント、動画のライブテストの素材作成用 ffmpeg、
      # Playwright のブラウザが使うライブラリ）は、取得した deb ファイルをキャッシュに保存し、
      # 2回目以降は Ubuntu のミラーを使わずに入れる。ミラーが遅い日にダウンロードだけで
      # ジョブの上限（60分）に達したため。キーはランナーのイメージと Playwright の版で分ける
      # （イメージが変わると足りない依存が変わるため）。
      - name: Resolve cache keys
        id: keys
        run: |
          echo "playwright=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore OS packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ steps.keys.outputs.image }}-pw${{ steps.keys.outputs.playwright }}-${{ hashFiles('.github/workflows/e2e.yaml') }}
      - name: Install OS packages
        timeout-minutes: 15
        env:
          CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          # キャッシュがあれば、ミラーを使わずに deb ファイルから入れる。失敗したら取得し直す
          if [ "$CACHE_HIT" = "true" ] && ls ~/apt-debs/*.deb > /dev/null 2>&1; then
            if sudo dpkg -i ~/apt-debs/*.deb > /tmp/dpkg.log 2>&1; then
              echo "キャッシュした deb ファイルから入れました"
              exit 0
            fi
            echo "::warning::キャッシュからの導入に失敗したため、ミラーから取得し直します"
            tail -20 /tmp/dpkg.log
          fi
          # Playwright が必要とするライブラリのうち、このランナーに無いものの一覧
          # （--dry-run は不足があると終了コード 1 を返すため、終了コードは見ない）
          PW_DEPS=$( { npx playwright install-deps --dry-run chromium firefox webkit 2>/dev/null || true; } | sed -n 's/^  \([a-z0-9][^ ]*\)$/\1/p' | tr '\n' ' ')
          echo "Playwright の不足分: ${PW_DEPS:-なし}"
          sudo apt-get update
          sudo apt-get install -y --download-only fonts-noto-cjk fonts-noto-color-emoji ffmpeg $PW_DEPS
          # 導入の後片付けで deb ファイルが消えることがあるため、導入の前に退避する
          mkdir -p ~/apt-debs
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji ffmpeg $PW_DEPS
      - name: Save OS packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ steps.keys.outputs.image }}-pw${{ steps.keys.outputs.playwright }}-${{ hashFiles('.github/workflows/e2e.yaml') }}

      # ブラウザ本体は Playwright の版ごとにキャッシュする（依存のライブラリは上の手順で入れる）
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.keys.outputs.playwright }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install chromium firefox webkit

      # 単体テスト（vitest）。E2E の前に失敗を検出する
      - run: npm run codegen
      - run: npm run test:unit
      - run: npm run test:astro

      # wrangler.jsonc は .gitignore 対象のため、Variables から生成する（astro dev が参照する）
      - name: Configure build setting
        run: node hack/render-deploy-config.mjs

      # astro dev が読む Worker のランタイム設定（.dev.vars は .gitignore 対象のため雛形から作る）
      - name: Configure runtime vars
        run: cp .dev.vars.template .dev.vars

      # 認証情報（.env.e2e）を Secret から復元する。値はログに出さず、env 経由で受け渡す。
      # 未登録なら作らず、ライブテストの project ごと無効になる（tests/e2e/live/env.ts）
      - name: Restore .env.e2e
        env:
          E2E_ENV: ${{ secrets.E2E_ENV }}
        run: |
          if [ -n "$E2E_ENV" ]; then
            printf '%s\n' "$E2E_ENV" > .env.e2e
            chmod 600 .env.e2e
            echo "ライブテストを有効にします"
          else
            echo "::warning::Secret E2E_ENV が未登録のため、ライブテストをスキップします"
          fi

      # astro dev は起動後にデーモン化するため、バックグラウンド起動して HTTPS の応答を待つ
      - name: Start dev server
        run: |
          npx astro dev > dev-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -ksf -o /dev/null https://localhost:4321/; then
              echo "dev サーバーが起動しました"
              exit 0
            fi
            sleep 2
          done
          echo "::error::dev サーバーが起動しませんでした"
          cat dev-server.log
          exit 1
        env:
          PUBLIC_VERSION: ci

      # 全 project（chromium / firefox / webkit / webkit-iphone / ライブテスト）を実行する
      - name: Run E2E
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            dev-server.log
          retention-days: 7
          if-no-files-found: ignore
