# PR の必須ゲートとなる E2E（Playwright）を実行する。`deploy.yaml` から `workflow_call` でも呼び出される。
# `npm run test:e2e` が偽の Bluesky と接続先の環境変数を dev サーバー・Playwright に渡す。実アカウントの live 層は実行しない。
# unit・component・route・render 層はこの workflow の必須条件に含めない。
# 実行対象ブラウザ: chromium / firefox / webkit / webkit-iphone
name: e2e

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# E2E の接続先と運営者設定は `npm run test:e2e` が config/e2e.json から wrangler.jsonc を生成して使うため、GitHub Variables は使わない。

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # lexicons/com/atproto/repo/strongRef.json は atproto サブモジュールへのシンボリックリンク。
          submodules: true
      - uses: actions/setup-node@v4
        with:
          # Cloudflare Workers が扱える Node.js のバージョンを指定する。
          node-version: 22.16.0
          cache: npm
      - run: npm ci

      # OS パッケージ（日本語・国旗フォント、動画素材用 ffmpeg、Playwright の依存）は deb をキャッシュし、以後 Ubuntu ミラーからの取得を避ける。
      # ミラーの遅延だけで 60 分の上限に達しうるため。ランナーイメージと Playwright の版をキーに含め、必要な依存の違いを分ける。
      - name: Resolve cache keys
        id: keys
        run: |
          echo "playwright=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore OS packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ steps.keys.outputs.image }}-pw${{ steps.keys.outputs.playwright }}-${{ hashFiles('.github/workflows/e2e.yaml') }}
      - name: Install OS packages
        timeout-minutes: 15
        env:
          CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          # キャッシュがあれば、ミラーを使わずに deb ファイルから入れる。失敗したら取得し直す
          if [ "$CACHE_HIT" = "true" ] && ls ~/apt-debs/*.deb > /dev/null 2>&1; then
            if sudo dpkg -i ~/apt-debs/*.deb > /tmp/dpkg.log 2>&1; then
              echo "キャッシュした deb ファイルから入れました"
              exit 0
            fi
            echo "::warning::キャッシュからの導入に失敗したため、ミラーから取得し直します"
            tail -20 /tmp/dpkg.log
          fi
          # Playwright が必要とするライブラリのうち、このランナーに無いものの一覧
          # （--dry-run は不足があると終了コード 1 を返すため、終了コードは見ない）
          PW_DEPS=$( { npx playwright install-deps --dry-run chromium firefox webkit 2>/dev/null || true; } | sed -n 's/^  \([a-z0-9][^ ]*\)$/\1/p' | tr '\n' ' ')
          echo "Playwright の不足分: ${PW_DEPS:-なし}"
          sudo apt-get update
          sudo apt-get install -y --download-only fonts-noto-cjk fonts-noto-color-emoji ffmpeg $PW_DEPS
          # 導入の後片付けで deb ファイルが消えることがあるため、導入の前に退避する
          mkdir -p ~/apt-debs
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji ffmpeg $PW_DEPS
      - name: Save OS packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ steps.keys.outputs.image }}-pw${{ steps.keys.outputs.playwright }}-${{ hashFiles('.github/workflows/e2e.yaml') }}

      # ブラウザ本体は Playwright の版ごとにキャッシュする。依存ライブラリは上の手順で導入する。
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.keys.outputs.playwright }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install chromium firefox webkit

      - run: npm run codegen

      # 偽の Bluesky・dev サーバー・Playwright は `npm run test:e2e` が起動し、ローカルと同じ経路を使う。
      - name: Run E2E
        run: npm run test:e2e
        env:
          CI: "true"
          PUBLIC_VERSION: ci

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            .cache/test-results/
            dev-server.log
          retention-days: 7
          if-no-files-found: ignore
