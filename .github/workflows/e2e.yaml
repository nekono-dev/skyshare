# E2E（Playwright）を実行する。PR の必須ゲート（要件 9.1）であり、deploy.yaml からも呼び出される（workflow_call）。
# 実行は npm run test:e2e に揃える。偽の Bluesky を起動し、接続先の環境変数を dev サーバーと Playwright に渡す（要件 10.3）。
# 実アカウントの live 層は実行しない（要件 9.3）。unit・component・route・render の層は必須にしない（要件 9.2）。
# 実行対象ブラウザ: chromium / firefox / webkit / webkit-iphone
name: e2e

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# 接続先と運営者の設定は、E2E の起動（npm run test:e2e）が config/e2e.json から wrangler.jsonc を生成して使う。GitHub の Variables は使わない

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # lexicons/com/atproto/repo/strongRef.json が atproto サブモジュールへのシンボリックリンクのため必要
          submodules: true
      - uses: actions/setup-node@v4
        with:
          # Cloudflare Workers が扱える Node.js の最新バージョンに固定（CLAUDE.md 参照）
          node-version: 22.16.0
          cache: npm
      - run: npm ci

      # OS のパッケージ（日本語・国旗絵文字のフォント、動画のライブテストの素材作成用 ffmpeg、
      # Playwright のブラウザが使うライブラリ）は、取得した deb ファイルをキャッシュに保存し、
      # 2回目以降は Ubuntu のミラーを使わずに入れる。ミラーが遅い日にダウンロードだけで
      # ジョブの上限（60分）に達したため。キーはランナーのイメージと Playwright の版で分ける
      # （イメージが変わると足りない依存が変わるため）。
      - name: Resolve cache keys
        id: keys
        run: |
          echo "playwright=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore OS packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ steps.keys.outputs.image }}-pw${{ steps.keys.outputs.playwright }}-${{ hashFiles('.github/workflows/e2e.yaml') }}
      - name: Install OS packages
        timeout-minutes: 15
        env:
          CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          # キャッシュがあれば、ミラーを使わずに deb ファイルから入れる。失敗したら取得し直す
          if [ "$CACHE_HIT" = "true" ] && ls ~/apt-debs/*.deb > /dev/null 2>&1; then
            if sudo dpkg -i ~/apt-debs/*.deb > /tmp/dpkg.log 2>&1; then
              echo "キャッシュした deb ファイルから入れました"
              exit 0
            fi
            echo "::warning::キャッシュからの導入に失敗したため、ミラーから取得し直します"
            tail -20 /tmp/dpkg.log
          fi
          # Playwright が必要とするライブラリのうち、このランナーに無いものの一覧
          # （--dry-run は不足があると終了コード 1 を返すため、終了コードは見ない）
          PW_DEPS=$( { npx playwright install-deps --dry-run chromium firefox webkit 2>/dev/null || true; } | sed -n 's/^  \([a-z0-9][^ ]*\)$/\1/p' | tr '\n' ' ')
          echo "Playwright の不足分: ${PW_DEPS:-なし}"
          sudo apt-get update
          sudo apt-get install -y --download-only fonts-noto-cjk fonts-noto-color-emoji ffmpeg $PW_DEPS
          # 導入の後片付けで deb ファイルが消えることがあるため、導入の前に退避する
          mkdir -p ~/apt-debs
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji ffmpeg $PW_DEPS
      - name: Save OS packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ steps.keys.outputs.image }}-pw${{ steps.keys.outputs.playwright }}-${{ hashFiles('.github/workflows/e2e.yaml') }}

      # ブラウザ本体は Playwright の版ごとにキャッシュする（依存のライブラリは上の手順で入れる）
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.keys.outputs.playwright }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install chromium firefox webkit

      - run: npm run codegen

      # 偽の Bluesky の起動、dev サーバーの起動、Playwright の実行は npm run test:e2e が行う（ローカルと同じ経路）
      - name: Run E2E
        run: npm run test:e2e
        env:
          CI: "true"
          PUBLIC_VERSION: ci

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            .cache/test-results/
            dev-server.log
          retention-days: 7
          if-no-files-found: ignore
