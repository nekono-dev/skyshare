# dev/** ブランチへの push で、Cloudflare Workers の Preview を作成・更新する（本番・develop のデプロイ済みバージョンは変えない）。
# branch-release-workflow（BRW）の `brw gen-workflow preview` の雛形を土台に、skyshare 固有の手順（ビルド時の設定・シークレット）を加えたもの。
#
# - Preview は宣言（.branch-release-workflow.json）の preview.target（develop）の Worker（skyshare-develop）に作る
# - ブランチ名から決めた Preview 名を付けるため、同じブランチに再 push しても
#   プレビューURL（https://<名前>.develop.<SITE_HOST>。宣言の preview.urlTemplate）は変わらず、中身だけ最新になる
# - ブランチ名は宣言の namePattern（dev/XXXX、XXXX は小文字英数字とハイフン）と maxNameLength に合うものだけを対象とし、Preview 名には XXXX を使う
# - URL は develop の独自ドメイン（BRW が生成する wrangler.jsonc の previews_enabled）で配信される。ジョブの Summary に出力する
#
# 必要な Secrets / Variables は deploy.yaml と共通（docs/DEVELOP.md の「CI/CD（GitHub Actions）」を参照）。
# 前提: develop の Worker が一度デプロイ済みであること（Preview は既存の Worker に作られる。wrangler 4.135.0 以上）。
# D1・R2 は develop 用を共用する。マイグレーションは develop への配備（deploy.yaml）で適用する。
# プレビューは develop 環境の設定を使い、共有設定が残っていれば環境なしの門番でビルドと配備を止める。
name: preview

on:
  push:
    branches: ["dev/**"]

# 同じブランチでは最新の push だけ反映するため、古い実行を中断する。
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUBLIC_LEGACY_BACKEND_ENDPOINT: ${{ vars.PUBLIC_LEGACY_BACKEND_ENDPOINT }}
  PUBLIC_DEFAULT_ATP_SERVICE: ${{ vars.PUBLIC_DEFAULT_ATP_SERVICE }}
  PUBLIC_NODE_ENV: ${{ vars.PUBLIC_NODE_ENV }}
  PUBLIC_OGP_EXTRACTOR_API: ${{ vars.PUBLIC_OGP_EXTRACTOR_API }}
  PUBLIC_PLC_DIRECTORY_BASE_URL: ${{ vars.PUBLIC_PLC_DIRECTORY_BASE_URL }}
  # 運用者ごとの設定（docs/DEVELOP.md の「運用者ごとの設定」）。SITE_HOST は BRW の宣言の ${SITE_HOST} にも使われる
  SITE_HOST: ${{ vars.SITE_HOST }}
  PUBLIC_OPERATOR_NAME: ${{ vars.PUBLIC_OPERATOR_NAME }}
  PUBLIC_OPERATOR_EMAIL: ${{ vars.PUBLIC_OPERATOR_EMAIL }}
  PUBLIC_OPERATOR_BLUESKY_HANDLE: ${{ vars.PUBLIC_OPERATOR_BLUESKY_HANDLE }}
  PUBLIC_PRIVACY_REVISED_AT: ${{ vars.PUBLIC_PRIVACY_REVISED_AT }}
  PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}

jobs:
  survey-config-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Reject shared survey config
        if: ${{ vars.SURVEY_CONFIG != '' }}
        run: |
          echo 'error: shared-config: リポジトリ（または組織）の変数 SURVEY_CONFIG が残っています。削除してください（DEVELOP.md 6.2.1）'
          exit 1

  preview:
    needs: [survey-config-guard]
    environment: develop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # lexicons/com/atproto/repo/strongRef.json は atproto サブモジュールへのシンボリックリンク。
          submodules: true
      - uses: actions/setup-node@v4
        with:
          # Cloudflare Workers が扱える Node.js のバージョンを指定する。
          node-version: 22.16.0
          cache: npm
      - run: npm ci

      # ブランチ名から Preview 名を作る（宣言の aliasStripPrefix を除き、"/" を "-" にする）。宣言の namePattern / 文字数に合わなければスキップする
      - name: Resolve preview alias
        id: alias
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if printf '%s' "$BRANCH_NAME" | grep -Eq '^dev/[a-z0-9]+(-[a-z0-9]+)*$' && [ "${#BRANCH_NAME}" -le 54 ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            name="${BRANCH_NAME#dev/}"
            echo "alias=${name//\//-}" >> "$GITHUB_OUTPUT"
            echo "Preview 名: ${name//\//-}"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ブランチ名 '$BRANCH_NAME' は命名規則に合わないため、プレビューをスキップします"
          fi

      # 宣言の deploy.brwSource から branch-release-workflow を取得する（設定の生成に使う）
      - name: Fetch branch-release-workflow
        if: steps.alias.outputs.valid == 'true'
        run: |
          git init -q "$RUNNER_TEMP/brw"
          git -C "$RUNNER_TEMP/brw" fetch -q --depth 1 'https://github.com/nekono-dev/branch-release-workflow.git' 'main'
          git -C "$RUNNER_TEMP/brw" checkout -q --detach FETCH_HEAD
          echo "BRW_DIR=$RUNNER_TEMP/brw" >> "$GITHUB_ENV"

      # テンプレート（config/wrangler.template.jsonc）からプレビュー先（develop）の wrangler.jsonc を生成する。
      # BRW が Worker 名・独自ドメイン（previews_enabled 付き）・workers_dev / preview_urls を書き、
      # 続けて renderHook（scripts/config/render-deploy-config.mjs）が vars・develop 用の D1・R2 を加える。
      - name: Render wrangler config
        if: steps.alias.outputs.valid == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRW_TARGET_NAME: develop
        run: node "$BRW_DIR/scripts/brw.mjs" render-wrangler --target "$BRW_TARGET_NAME" --write

      # サイト URL（共有リンクなど）をプレビューのドメインにする。
      # SURVEY_CONFIG は設定生成に使うビルドだけに渡し、生成失敗時はデプロイを止める。
      # 結果ページは、ビルドの間に develop の結果の保管先（R2）から公開済みの統計を読んで生成する。
      # 読むための認証情報は、このビルドの工程にだけ渡す（無い環境では結果ページを作らない）。
      - name: Run build
        if: steps.alias.outputs.valid == 'true'
        env:
          SURVEY_CONFIG: ${{ vars.SURVEY_CONFIG }}
          SITE_HOST: ${{ steps.alias.outputs.alias }}.develop.${{ vars.SITE_HOST }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run build

      # develop の Worker とプレビューの基本設定に未登録のシークレットを生成して登録する。登録済みの値は上書きしない。
      # Preview は作成時の基本設定のシークレットを使うため、デプロイ前に登録する。
      # 既存 Preview に必要なシークレットが欠けていれば削除し、次のデプロイで基本設定から再作成する（URL は変わらない）。
      - name: Ensure worker secrets
        if: steps.alias.outputs.valid == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ALIAS: ${{ steps.alias.outputs.alias }}
        run: node scripts/secrets/ensure-worker-secrets.mjs --develop --preview "$PREVIEW_ALIAS"

      # wrangler preview はブランチ別の Preview を作成・更新し、本番のデプロイ状態を変えない。
      # 同じ名前で再実行すると URL は変わらず内容だけが更新される。
      - name: Deploy preview
        if: steps.alias.outputs.valid == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ALIAS: ${{ steps.alias.outputs.alias }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          npx wrangler preview \
            --name "$PREVIEW_ALIAS" \
            --tag "${COMMIT_SHA::7}" \
            --message "preview: $BRANCH_NAME @ ${COMMIT_SHA::7}"

      - name: Show preview URL
        if: steps.alias.outputs.valid == 'true'
        env:
          PREVIEW_ALIAS: ${{ steps.alias.outputs.alias }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "### プレビューURL"
            echo ""
            echo "- ブランチ: \`$BRANCH_NAME\`"
            echo "- URL: https://${PREVIEW_ALIAS}.develop.${SITE_HOST}"
            echo ""
            echo "同じブランチへ再 push しても URL は変わりません。"
          } >> "$GITHUB_STEP_SUMMARY"
