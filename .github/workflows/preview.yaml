# dev/** ブランチへの push をトリガーに、Cloudflare Workers へ「プレビュー用バージョン」をアップロードする。
#
# - 本番へは公開しない（wrangler preview。本番の Worker / デプロイ済みバージョンは変わらない）
# - ブランチ名から決めた Preview 名を付けるため、同じブランチに再 push しても
#   プレビューURL（https://<名前>.<SITE_HOST>）は変わらず、中身だけ最新になる
# - ブランチ名は dev/XXXX（XXXX は小文字英数字とハイフンのみ）のルールに合うものだけが対象
# - URLはカスタムドメイン（wrangler.jsonc の previews_enabled）で配信される。ジョブの Summary に出力する
#
# 必要な Secrets / Variables は deploy.yaml と共通（DEVELOP.md の「CI/CD（GitHub Actions）」を参照。ブランチ規則・案内ルールは .claude/skills/branch-release-workflow）。
# 前提: Worker が一度デプロイ済みで、カスタムドメインの previews_enabled が true であること（wrangler 4.135.0 以上）。
name: preview

on:
  push:
    branches: ["dev/**"]

# 同一ブランチのプレビューは最新の push だけ反映すればよいため、古い実行は中断する
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUBLIC_LEGACY_BACKEND_ENDPOINT: ${{ vars.PUBLIC_LEGACY_BACKEND_ENDPOINT }}
  PUBLIC_DEFAULT_ATP_SERVICE: ${{ vars.PUBLIC_DEFAULT_ATP_SERVICE }}
  PUBLIC_NODE_ENV: ${{ vars.PUBLIC_NODE_ENV }}
  PUBLIC_OGP_EXTRACTOR_API: ${{ vars.PUBLIC_OGP_EXTRACTOR_API }}
  PUBLIC_PLC_DIRECTORY_BASE_URL: ${{ vars.PUBLIC_PLC_DIRECTORY_BASE_URL }}
  # 運用者ごとの設定（DEVELOP.md の「運用者ごとの設定」）
  SITE_HOST: ${{ vars.SITE_HOST }}
  ZONE_NAME: ${{ vars.ZONE_NAME }}
  WORKER_NAME: ${{ vars.WORKER_NAME }}
  SCHEDULE_D1_NAME: ${{ vars.SCHEDULE_D1_NAME }}
  SCHEDULE_D1_DATABASE_ID: ${{ vars.SCHEDULE_D1_DATABASE_ID }}
  SCHEDULE_R2_BUCKET: ${{ vars.SCHEDULE_R2_BUCKET }}
  PREVIEW_D1_NAME: ${{ vars.PREVIEW_D1_NAME }}
  PREVIEW_D1_DATABASE_ID: ${{ vars.PREVIEW_D1_DATABASE_ID }}
  PREVIEW_R2_BUCKET: ${{ vars.PREVIEW_R2_BUCKET }}
  PUBLIC_OPERATOR_NAME: ${{ vars.PUBLIC_OPERATOR_NAME }}
  PUBLIC_OPERATOR_EMAIL: ${{ vars.PUBLIC_OPERATOR_EMAIL }}
  PUBLIC_OPERATOR_BLUESKY_HANDLE: ${{ vars.PUBLIC_OPERATOR_BLUESKY_HANDLE }}
  PUBLIC_PRIVACY_ENACTED_AT: ${{ vars.PUBLIC_PRIVACY_ENACTED_AT }}
  PUBLIC_PRIVACY_REVISED_AT: ${{ vars.PUBLIC_PRIVACY_REVISED_AT }}
  PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # lexicons/com/atproto/repo/strongRef.json が atproto サブモジュールへのシンボリックリンクのため必要
          submodules: true
      - uses: actions/setup-node@v4
        with:
          # Cloudflare Workers が扱える Node.js の最新バージョンに固定（AGENTS.md 参照）
          node-version: 22.16.0
          cache: npm
      - run: npm ci

      # ブランチ名（dev/XXXX）から Preview 名（dev-XXXX）を作る。
      # ブランチ命名ルール（.claude/skills/branch-release-workflow 参照）: XXXX は小文字英数字とハイフンのみ・先頭末尾はハイフン不可・
      # 連続ハイフン不可・50文字以内。ルールに合わないブランチは警告を出してプレビューを行わない
      # （alias は DNS ラベルになるため。Worker名込みで63文字以内に収めるための上限）。
      - name: Resolve preview alias
        id: alias
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if printf '%s' "$BRANCH_NAME" | grep -Eq '^dev/[a-z0-9]+(-[a-z0-9]+)*$' && [ "${#BRANCH_NAME}" -le 54 ]; then
            alias="dev-${BRANCH_NAME#dev/}"
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "alias=$alias" >> "$GITHUB_OUTPUT"
            echo "Preview 名: $alias"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ブランチ名 '$BRANCH_NAME' は dev/XXXX（XXXX は小文字英数字とハイフンのみ、50文字以内）のルールに合わないため、プレビューをスキップします"
          fi

      # wrangler.jsonc と _legacy/frontend/.env.production は .gitignore 対象のため、Variables から生成する
      - name: Configure build setting
        if: steps.alias.outputs.valid == 'true'
        run: node hack/render-deploy-config.mjs
      - name: Run build
        if: steps.alias.outputs.valid == 'true'
        run: npm run build

      # プレビュー専用の D1 に、未適用のマイグレーションを適用する（適用済みのものは再実行されない）
      # CI の API トークンに D1 の編集権限が無い場合は失敗するが、適用済みのデータベースへの
      # プレビューの更新を止めないよう、失敗しても続行する（失敗はログの警告で確認する）
      - name: Apply D1 migrations (preview)
        if: steps.alias.outputs.valid == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node hack/apply-d1-migrations.mjs

      # wrangler preview はブランチ別の Preview を作成・更新する（本番のデプロイ状態は変えない）。
      # 同じ名前で再実行すると URL は変わらず中身だけ最新になる
      - name: Deploy preview
        if: steps.alias.outputs.valid == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ALIAS: ${{ steps.alias.outputs.alias }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          npx wrangler preview \
            --name "$PREVIEW_ALIAS" \
            --tag "${COMMIT_SHA::7}" \
            --message "preview: $BRANCH_NAME @ ${COMMIT_SHA::7}"

      - name: Show preview URL
        if: steps.alias.outputs.valid == 'true'
        env:
          PREVIEW_ALIAS: ${{ steps.alias.outputs.alias }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "### プレビューURL"
            echo ""
            echo "- ブランチ: \`$BRANCH_NAME\`"
            echo "- URL: https://${PREVIEW_ALIAS}.${SITE_HOST}"
            echo ""
            echo "同じブランチへ再 push しても URL は変わりません。"
          } >> "$GITHUB_STEP_SUMMARY"
