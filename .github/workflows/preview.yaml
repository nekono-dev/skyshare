# dev/** ブランチへの push で、Cloudflare Workers にプレビュー用バージョンをアップロードする。
#
# - develop 用の Worker（skyshare-develop）の Preview として作る（本番・develop のデプロイ済みバージョンは変わらない）
# - ブランチ名から決めた Preview 名を付けるため、同じブランチに再 push しても
#   プレビューURL（https://<名前>.develop.<SITE_HOST>）は変わらず、中身だけ最新になる
# - ブランチ名は dev/XXXX（XXXX は小文字英数字とハイフンのみ）の形だけを対象とし、Preview 名には XXXX を使う。
# - URLはカスタムドメイン（wrangler.jsonc の previews_enabled）で配信される。ジョブの Summary に出力する
#
# 必要な Secrets / Variables は deploy.yaml と共通（docs/DEVELOP.md の「CI/CD（GitHub Actions）」を参照）。ブランチ規則と案内は branch-release-workflow プラグインと .branch-release-workflow.json が定める。
# 前提: Worker が一度デプロイ済みで、カスタムドメインの previews_enabled が true であること（wrangler 4.135.0 以上）。
# D1・R2 がある場合は develop 用を共用する。マイグレーションは develop への配備（deploy.yaml）で適用する。
# 前提: develop の Worker が一度デプロイ済みであること（Preview は既存の Worker に作られる）。
name: preview

on:
  push:
    branches: ["dev/**"]

# 同じブランチでは最新の push だけ反映するため、古い実行を中断する。
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUBLIC_LEGACY_BACKEND_ENDPOINT: ${{ vars.PUBLIC_LEGACY_BACKEND_ENDPOINT }}
  PUBLIC_DEFAULT_ATP_SERVICE: ${{ vars.PUBLIC_DEFAULT_ATP_SERVICE }}
  PUBLIC_NODE_ENV: ${{ vars.PUBLIC_NODE_ENV }}
  PUBLIC_OGP_EXTRACTOR_API: ${{ vars.PUBLIC_OGP_EXTRACTOR_API }}
  PUBLIC_PLC_DIRECTORY_BASE_URL: ${{ vars.PUBLIC_PLC_DIRECTORY_BASE_URL }}
  # 運用者ごとの設定（docs/DEVELOP.md の「運用者ごとの設定」）
  SITE_HOST: ${{ vars.SITE_HOST }}
  PUBLIC_OPERATOR_NAME: ${{ vars.PUBLIC_OPERATOR_NAME }}
  PUBLIC_OPERATOR_EMAIL: ${{ vars.PUBLIC_OPERATOR_EMAIL }}
  PUBLIC_OPERATOR_BLUESKY_HANDLE: ${{ vars.PUBLIC_OPERATOR_BLUESKY_HANDLE }}
  PUBLIC_PRIVACY_ENACTED_AT: ${{ vars.PUBLIC_PRIVACY_ENACTED_AT }}
  PUBLIC_PRIVACY_REVISED_AT: ${{ vars.PUBLIC_PRIVACY_REVISED_AT }}
  PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # lexicons/com/atproto/repo/strongRef.json は atproto サブモジュールへのシンボリックリンク。
          submodules: true
      - uses: actions/setup-node@v4
        with:
          # Cloudflare Workers が扱える Node.js のバージョンを指定する。
          node-version: 22.16.0
          cache: npm
      - run: npm ci

      # dev/XXXX 形式のブランチ名から Preview 名 XXXX を作る。
      # XXXX は小文字英数字と単一のハイフン区切りで、先頭末尾のハイフンを許さず46文字以内。
      # DNS ラベルと Worker 名（skyshare-develop）を合わせて63文字以内にするため、条件外のブランチは警告してプレビューを省く。
      - name: Resolve preview alias
        id: alias
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if printf '%s' "$BRANCH_NAME" | grep -Eq '^dev/[a-z0-9]+(-[a-z0-9]+)*$' && [ "${#BRANCH_NAME}" -le 50 ]; then
            alias="${BRANCH_NAME#dev/}"
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "alias=$alias" >> "$GITHUB_OUTPUT"
            echo "Preview 名: $alias"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ブランチ名 '$BRANCH_NAME' は dev/XXXX（XXXX は小文字英数字とハイフンのみ、46文字以内）のルールに合わないため、プレビューをスキップします"
          fi

      # scripts/config/render-deploy-config.mjs が使う外部 branch-release-workflow プラグインを取得する。
      # 秘密情報を扱うため、取得元（.branch-release-workflow-source.json）で指定されたブランチの最新コミットを使う。
      - name: Fetch branch-release-workflow
        if: steps.alias.outputs.valid == 'true'
        run: |
          brw_dir="$(node scripts/agent/setup-brw.mjs)"
          echo "BRW_PLUGIN_DIR=$brw_dir" >> "$GITHUB_ENV"

      - name: Configure build setting
        if: steps.alias.outputs.valid == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/config/render-deploy-config.mjs --develop
      # サイト URL（共有リンクなど）をプレビューのドメインにする。
      # SURVEY_CONFIG は設定生成に使うビルドだけに渡し、生成失敗時はデプロイを止める。
      # 結果ページは、ビルドの間に develop の結果の保管先（R2）から公開済みの統計を読んで生成する。
      # 読むための認証情報は、このビルドの工程にだけ渡す（無い環境では結果ページを作らない）。
      - name: Run build
        if: steps.alias.outputs.valid == 'true'
        env:
          SURVEY_CONFIG: ${{ vars.SURVEY_CONFIG }}
          SITE_HOST: ${{ steps.alias.outputs.alias }}.develop.${{ vars.SITE_HOST }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run build


      # develop の Worker とプレビューの基本設定に未登録のシークレットを生成して登録する。登録済みの値は上書きしない。
      # Preview は作成時の基本設定のシークレットを使うため、デプロイ前に登録する。
      # 既存 Preview に必要なシークレットが欠けていれば削除し、次のデプロイで基本設定から再作成する（URL は変わらない）。
      - name: Ensure worker secrets
        if: steps.alias.outputs.valid == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ALIAS: ${{ steps.alias.outputs.alias }}
        run: node scripts/secrets/ensure-worker-secrets.mjs --develop --preview "$PREVIEW_ALIAS"

      # wrangler preview はブランチ別の Preview を作成・更新し、本番のデプロイ状態を変えない。
      # 同じ名前で再実行すると URL は変わらず内容だけが更新される。
      - name: Deploy preview
        if: steps.alias.outputs.valid == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ALIAS: ${{ steps.alias.outputs.alias }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          npx wrangler preview \
            --name "$PREVIEW_ALIAS" \
            --tag "${COMMIT_SHA::7}" \
            --message "preview: $BRANCH_NAME @ ${COMMIT_SHA::7}"

      - name: Show preview URL
        if: steps.alias.outputs.valid == 'true'
        env:
          PREVIEW_ALIAS: ${{ steps.alias.outputs.alias }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "### プレビューURL"
            echo ""
            echo "- ブランチ: \`$BRANCH_NAME\`"
            echo "- URL: https://${PREVIEW_ALIAS}.develop.${SITE_HOST}"
            echo ""
            echo "同じブランチへ再 push しても URL は変わりません。"
          } >> "$GITHUB_STEP_SUMMARY"
