# dev/** ブランチへの push をトリガーに、独立したステージング用 Worker（<WORKER_NAME>-staging）へ配備する。
#
# - Cron Trigger は `wrangler preview` では動かないため、予約の自動投稿を確認する用の別 Worker を使う
# - 配備先は Variable `STAGING_HOST` のドメイン（本番とは別の Worker。D1・R2 はプレビューと共用し、本番のデータには触れない）
# - `STAGING_HOST` が未登録のリポジトリでは、ステージングを行わない
# - 配備先は 1 つだけなので、最後に push したブランチの内容に置き換わる（ブランチ別のプレビューは preview.yaml）
# - シークレット SCHEDULE_ENC_KEY は Worker に登録済み（`wrangler secret put SCHEDULE_ENC_KEY --name <WORKER_NAME>-staging`）。配備しても消えない
#
# 必要な Secrets / Variables は deploy.yaml と共通（DEVELOP.md の「CI/CD（GitHub Actions）」を参照）。
name: staging

on:
  push:
    branches: ["dev/**"]
  workflow_dispatch:

# 配備先が 1 つのため、同時に走らせず、古い実行は中断する
concurrency:
  group: staging
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUBLIC_LEGACY_BACKEND_ENDPOINT: ${{ vars.PUBLIC_LEGACY_BACKEND_ENDPOINT }}
  PUBLIC_DEFAULT_ATP_SERVICE: ${{ vars.PUBLIC_DEFAULT_ATP_SERVICE }}
  PUBLIC_NODE_ENV: ${{ vars.PUBLIC_NODE_ENV }}
  PUBLIC_OGP_EXTRACTOR_API: ${{ vars.PUBLIC_OGP_EXTRACTOR_API }}
  PUBLIC_PLC_DIRECTORY_BASE_URL: ${{ vars.PUBLIC_PLC_DIRECTORY_BASE_URL }}
  # 運用者ごとの設定（DEVELOP.md の「運用者ごとの設定」）
  SITE_HOST: ${{ vars.SITE_HOST }}
  ZONE_NAME: ${{ vars.ZONE_NAME }}
  WORKER_NAME: ${{ vars.WORKER_NAME }}
  SCHEDULE_D1_NAME: ${{ vars.SCHEDULE_D1_NAME }}
  SCHEDULE_D1_DATABASE_ID: ${{ vars.SCHEDULE_D1_DATABASE_ID }}
  SCHEDULE_R2_BUCKET: ${{ vars.SCHEDULE_R2_BUCKET }}
  PREVIEW_D1_NAME: ${{ vars.PREVIEW_D1_NAME }}
  PREVIEW_D1_DATABASE_ID: ${{ vars.PREVIEW_D1_DATABASE_ID }}
  PREVIEW_R2_BUCKET: ${{ vars.PREVIEW_R2_BUCKET }}
  PUBLIC_OPERATOR_NAME: ${{ vars.PUBLIC_OPERATOR_NAME }}
  PUBLIC_OPERATOR_EMAIL: ${{ vars.PUBLIC_OPERATOR_EMAIL }}
  PUBLIC_OPERATOR_BLUESKY_HANDLE: ${{ vars.PUBLIC_OPERATOR_BLUESKY_HANDLE }}
  PUBLIC_PRIVACY_ENACTED_AT: ${{ vars.PUBLIC_PRIVACY_ENACTED_AT }}
  PUBLIC_PRIVACY_REVISED_AT: ${{ vars.PUBLIC_PRIVACY_REVISED_AT }}
  PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
  STAGING_HOST: ${{ vars.STAGING_HOST }}

jobs:
  staging:
    if: vars.STAGING_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # lexicons/com/atproto/repo/strongRef.json が atproto サブモジュールへのシンボリックリンクのため必要
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Configure build setting
        run: node hack/render-deploy-config.mjs --staging
      - name: Run build
        run: npm run build

      # プレビューと共用の D1 に、未適用のマイグレーションを適用する（失敗しても配備は続ける。preview.yaml と同じ理由）
      - name: Apply D1 migrations (staging)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node hack/apply-d1-migrations.mjs

      - name: Deploy staging worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          npx wrangler deploy \
            --tag "${COMMIT_SHA::7}" \
            --message "staging: $BRANCH_NAME @ ${COMMIT_SHA::7}"

      - name: Show staging URL
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "### ステージングURL"
            echo ""
            echo "- ブランチ: \`$BRANCH_NAME\`"
            echo "- URL: https://${STAGING_HOST}"
            echo "- Cron Trigger（予約の自動投稿）も動作します。最後に push したブランチの内容に置き換わります。"
          } >> "$GITHUB_STEP_SUMMARY"
