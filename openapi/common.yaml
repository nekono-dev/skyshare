error:
  type: object
  properties:
    error:
      type: string
      example: Invalid credentials

content-type:
  description: The MIME type of the body of the request or response
  schema:
    type: string
    enum:
      - application/json
    example: application/json

cookie:
  description: cookie
  schema:
    type: string
    example: sid=abc123; Path=/; HttpOnly

ogMeta:
  type: object
  properties:
    title:
      type: string
      example: ""
    description:
      type: string
      example: ""
    image:
      type: string
      format: uri
      example: "https://example.com/og.png"
    url:
      type: string
      format: uri
      description: OGP取得元のページURL。app.bsky.embed.externalのuriに使う。
      example: "https://example.com/article"
  required:
    - title
    - description
    - url

imagesMeta:
  type: array
  items:
    type: object
    required:
      - width
      - height
    properties:
      width:
        type: integer
        minimum: 1
      height:
        type: integer
        minimum: 1

legacyPageEntry:
  type: object
  properties:
    ogp:
      type: string
    handle:
      type: string
    imgs:
      type: array
      items:
        type: object
        properties:
          thumb:
            type: string
          alt:
            type: string
        required:
          - thumb
          - alt
  required:
    - ogp
    - handle
    - imgs

legacyPageError:
  type: object
  properties:
    error:
      type: string
      enum:
        - BadRequest
        - RateLimitExceeded
        - InternalServerError
  required:
    - error
