summary: Login ATProto service
operationId: createSession
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          identifier:
            type: string
            example: user@example.com
          password:
            type: string
            example: secret-password
          service:
            type: string
            example: http://bsky.social
        required:
          - identifier
          - password
          - service
responses:
  "200":
    description: Success post
    headers:
      set-cookie:
        schema:
          $ref: ../../common.yaml#/cookie
  "400":
    description: Bad Request
    content:
      application/json:
        schema:
          $ref: ../../common.yaml#/error
  "401":
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: ../../common.yaml#/error
  "429":
    description: Too Many Requests
    content:
      application/json:
        schema:
          $ref: ../../common.yaml#/error
  "500":
    description: Internal Server Error
    content:
      application/json:
        schema:
          $ref: ../../common.yaml#/error
