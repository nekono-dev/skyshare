summary: Get draft list from Bluesky
operationId: getDrafts
parameters:
  - name: cookie
    in: header
    required: true
    schema:
      $ref: ../../../common.yaml#/cookie
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
  - name: cursor
    in: query
    required: false
    schema:
      type: string
responses:
  "200":
    description: Success
    content:
      application/json:
        schema:
          type: object
          properties:
            cursor:
              type: string
            drafts:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  text:
                    type: string
                  labels:
                    type: array
                    items:
                      type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - text
                  - createdAt
                  - updatedAt
          required:
            - drafts

  "400":
    description: Bad Request
    content:
      application/json:
        schema:
          $ref: ../../../common.yaml#/error
  "401":
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: ../../../common.yaml#/error
  "429":
    description: Too Many Requests
    content:
      application/json:
        schema:
          $ref: ../../../common.yaml#/error
  "500":
    description: Internal Server Error
    content:
      application/json:
        schema:
          $ref: ../../../common.yaml#/error
