summary: Get own Skyshare entries, each annotated with whether its source Bluesky post still exists
operationId: getSkyshareEntries
parameters:
  - name: cookie
    in: header
    required: true
    schema:
      $ref: ../../../common.yaml#/cookie
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
  - name: cursor
    in: query
    required: false
    schema:
      type: string
responses:
  "200":
    description: Success
    content:
      application/json:
        schema:
          type: object
          properties:
            cursor:
              type: string
            entries:
              type: array
              items:
                type: object
                properties:
                  uri:
                    type: string
                  cid:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  sourceUri:
                    type: string
                  sourceCid:
                    type: string
                  heading:
                    type: string
                  caption:
                    type: string
                  visualUrl:
                    type: string
                  webUrl:
                    type: string
                  orphaned:
                    type: boolean
                    description: >-
                      紐づく Bluesky 投稿（source）が削除済みで存在しない場合 true。
                required:
                  - uri
                  - cid
                  - createdAt
                  - sourceUri
                  - sourceCid
                  - orphaned
          required:
            - entries
  "400":
    description: Bad Request
    content:
      application/json:
        schema:
          $ref: ../../../common.yaml#/error
  "401":
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: ../../../common.yaml#/error
  "429":
    description: Too Many Requests
    content:
      application/json:
        schema:
          $ref: ../../../common.yaml#/error
  "500":
    description: Internal Server Error
    content:
      application/json:
        schema:
          $ref: ../../../common.yaml#/error
