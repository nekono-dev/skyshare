summary: Extract OGP information from URL
operationId: extractUrl
parameters:
  - name: url
    in: query
    required: true
    schema:
      type: string
      format: uri
      required:
        - uri
responses:
  "200":
    description: Success
    content:
      application/json:
        schema:
          $ref: ../../common.yaml#/ogMeta
  "400":
    description: Bad Request
    content:
      application/json:
        schema:
          $ref: ../../common.yaml#/error
