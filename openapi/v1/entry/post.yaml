summary: Create a new entry (supports multipart/form-data with optional file)
operationId: createEntry
parameters:
  - name: cookie
    in: header
    required: true
    schema:
      $ref: ../../common.yaml#/cookie
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        anyOf:
          - required:
              - text
          - required:
              - images
              - imagesMeta
          - required:
              - ogMeta
        properties:
          images:
            type: array
            items:
              type: string
              format: binary
          imagesMeta:
            $ref: ../../common.yaml#/imagesMeta
          ogImage:
            type: string
            format: binary
          text:
            type: string
            example: Post content
            minLength: 1
          ogMeta:
            $ref: ../../common.yaml#/ogMeta
          langs:
            type: array
            items:
              type: string
              example: ja
          selfLabels:
            type: string
            enum:
              - sexual
              - nudity
              - porn
              - spoiler
              - "!warn"
responses:
  "200":
    description: Success post
    content:
      application/json:
        schema:
          type: object
          properties:
            bsky:
              type: object
              properties:
                url:
                  type: string
                  example: did:example.com/abcd1234
              required:
                - url
            skyshare:
              type: object
              properties:
                uri:
                  type: string
                  example: did:example.com/abcd1234
              required:
                - uri
          required:
            - bsky
            - skyshare
  "400":
    description: Bad Request
    content:
      application/json:
        schema:
          $ref: ../../common.yaml#/error
