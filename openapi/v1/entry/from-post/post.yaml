summary: Create a skyshare entry from an existing Bluesky post
operationId: createEntryFromPost
parameters:
  - name: cookie
    in: header
    required: true
    schema:
      $ref: ../../../common.yaml#/cookie
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          postUri:
            type: string
            example: at://did:plc:abc/app.bsky.feed.post/3lxyz
        required:
          - postUri
responses:
  "200":
    description: Success
    content:
      application/json:
        schema:
          type: object
          properties:
            skyshare:
              type: object
              properties:
                uri:
                  type: string
              required:
                - uri
          required:
            - skyshare
  "400":
    description: Bad Request
    content:
      application/json:
        schema:
          $ref: ../../../common.yaml#/error
  "401":
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: ../../../common.yaml#/error
  "404":
    description: Not Found
    content:
      application/json:
        schema:
          $ref: ../../../common.yaml#/error
  "429":
    description: Too Many Requests
    content:
      application/json:
        schema:
          $ref: ../../../common.yaml#/error
  "500":
    description: Internal Server Error
    content:
      application/json:
        schema:
          $ref: ../../../common.yaml#/error
