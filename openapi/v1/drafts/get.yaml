summary: Get draft list from Bluesky
operationId: getDrafts
parameters:
  - name: cookie
    in: header
    required: true
    schema:
      $ref: ../../common.yaml#/cookie
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
  - name: cursor
    in: query
    required: false
    schema:
      type: string
responses:
  "200":
    description: Success
    content:
      application/json:
        schema:
          type: object
          properties:
            cursor:
              type: string
            drafts:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  draft:
                    type: object
                    properties:
                      posts:
                        type: array
                        items:
                          type: object
                          properties:
                            text:
                              type: string
                            labels:
                              type: object
                              additionalProperties: true
                            embedImages:
                              type: array
                              items:
                                type: object
                                additionalProperties: true
                            embedVideos:
                              type: array
                              items:
                                type: object
                                additionalProperties: true
                            embedExternals:
                              type: array
                              items:
                                type: object
                                additionalProperties: true
                            embedRecords:
                              type: array
                              items:
                                type: object
                                additionalProperties: true
                          required:
                            - text
                      langs:
                        type: array
                        items:
                          type: string
                      postgateEmbeddingRules:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      threadgateAllow:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                    required:
                      - posts
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - draft
                  - createdAt
                  - updatedAt
          required:
            - drafts

  "400":
    description: Bad Request
    content:
      application/json:
        schema:
          $ref: ../../common.yaml#/error
  "401":
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: ../../common.yaml#/error
  "429":
    description: Too Many Requests
    content:
      application/json:
        schema:
          $ref: ../../common.yaml#/error
  "500":
    description: Internal Server Error
    content:
      application/json:
        schema:
          $ref: ../../common.yaml#/error
