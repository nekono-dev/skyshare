<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skyshare ロゴタイプライター</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <style>
      /* レイアウト: 画面全体をステージにして中央にロゴを置き、下端に撮影用の操作バーを固定する */
      :root {
        --bg: #ffffff;
        --fg: #16233a;
        --muted: #5d6b82;
        --panel: #f1f5fb;
        --line: #d5dded;
        /* ロゴ画像から実測した色(Sky / share) */
        --brand: #4a84f6;
        --brand-light: #74ccfa;
        --font-ui:
          "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d1424;
          --fg: #e6edf9;
          --muted: #92a0ba;
          --panel: #17203a;
          --line: #2a3555;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0d1424;
        --fg: #e6edf9;
        --muted: #92a0ba;
        --panel: #17203a;
        --line: #2a3555;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-ui);
        font-size: 13px;
      }

      .stage {
        height: 100%;
        background: var(--stage-bg, var(--bg));
        display: grid;
        place-items: center;
        padding-inline: 16px;
        cursor: default;
      }
      .stage[data-bg="white"] {
        --stage-bg: #ffffff;
      }
      .stage[data-bg="black"] {
        --stage-bg: #000000;
      }
      .stage[data-bg="green"] {
        --stage-bg: #00b140;
      }
      /* ステージを全面に敷くため body の背景もステージ色に合わせる */
      body:has(.stage[data-bg="white"]) {
        background: #ffffff;
      }
      body:has(.stage[data-bg="black"]) {
        background: #000000;
      }
      body:has(.stage[data-bg="green"]) {
        background: #00b140;
      }

      .logo {
        position: relative;
        width: min(100%, 1200px);
        aspect-ratio: 1412 / 334;
        margin-bottom: 64px;
      }
      .ch {
        position: absolute;
        top: 0;
        height: 100%;
        background-image: var(--logo);
        background-repeat: no-repeat;
        visibility: hidden;
      }
      .ch.on {
        visibility: visible;
      }
      .caret {
        position: absolute;
        top: 12%;
        height: 80%;
        width: 1.1%;
        background: var(--caret, var(--brand));
        border-radius: 1px;
        transition: background-color 0.08s;
      }
      .caret.blink {
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .caret.off {
        display: none;
      }

      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-wrap: wrap;
        gap: 12px 20px;
        align-items: center;
        justify-content: center;
        background: var(--panel);
        border-top: 1px solid var(--line);
        color: var(--fg);
        transition: transform 0.25s;
      }
      body.clean .bar {
        transform: translateY(110%);
      }
      .bar label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }
      .bar select,
      .bar input[type="range"] {
        font: inherit;
        color: var(--fg);
      }
      .bar select {
        background: var(--bg);
        border: 1px solid var(--line);
        padding: 5px 8px;
      }
      button {
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        background: var(--brand);
        color: #fff;
        border: 0;
        padding: 8px 16px;
      }
      button.sub {
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--line);
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--brand-light);
        outline-offset: 2px;
      }
      .hint {
        color: var(--muted);
      }
    </style>
    <style>
      html,
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage" data-bg="white">
      <div class="logo" id="logo" role="img" aria-label="Skyshare"></div>
    </div>

    <div class="bar" id="bar">
      <button id="play" type="button">最初から再生</button>
      <label for="speed"
        >速度
        <select id="speed">
          <option value="1.6">ゆっくり</option>
          <option value="1" selected>標準</option>
          <option value="0.6">速い</option>
        </select>
      </label>
      <label for="bg"
        >背景
        <select id="bg">
          <option value="auto">テーマに合わせる</option>
          <option value="white" selected>白</option>
          <option value="black">黒</option>
          <option value="green">グリーンバック</option>
        </select>
      </label>
      <label for="loop"><input type="checkbox" id="loop" /> ループ</label>
      <button id="hide" class="sub" type="button">操作バーを隠す</button>
      <span class="hint">H キーまたは画面クリックで表示切替</span>
    </div>

        var W = 1412,
          H = 334
        // 画像の文字間の中間点で切り出した境界(S k y s h a r e)
        var cuts = [0, 225.5, 382.5, 544, 699.5, 859, 1025.5, 1128.5, 1412]
        // 各文字の右端(インク終端)。キャレット位置に使う
        var inkEnd = [214, 378, 539, 690, 848, 1015, 1125, 1278]

        var logo = document.getElementById("logo")
        logo.style.setProperty("--logo", "url(" + SRC + ")")
        var chars = []
        for (var i = 0; i < 8; i++) {
          var x0 = cuts[i],
            w = cuts[i + 1] - x0
          var el = document.createElement("div")
          el.className = "ch"
          el.style.left = (x0 / W) * 100 + "%"
          el.style.width = (w / W) * 100 + "%"
          el.style.backgroundSize = (W / w) * 100 + "% 100%"
          el.style.backgroundPosition =
            (w >= W ? 0 : (x0 / (W - w)) * 100) + "% 0"
          logo.appendChild(el)
          chars.push(el)
        }
        var caret = document.createElement("div")
        caret.className = "caret blink"
        logo.appendChild(caret)

        // 文字の色に合わせたキャレット色(S k y = 濃い青、s h a r e = 水色)
        var caretColors = [
          "var(--brand)",
          "var(--brand)",
          "var(--brand)",
          "var(--brand-light)",
          "var(--brand-light)",
          "var(--brand-light)",
          "var(--brand-light)",
          "var(--brand-light)",
        ]
        function caretColor(i) {
          caret.style.setProperty("--caret", caretColors[i])
        }
        function caretAt(px) {
          caret.style.left = (px / W) * 100 + "%"
        }
        caretAt(24)
        caretColor(0)

        var reduce = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches
        var timer = null,
          run = 0
        var speed = document.getElementById("speed")
        var loop = document.getElementById("loop")

        function wait(ms) {
          return new Promise(function (r) {
            timer = setTimeout(r, ms)
          })
        }
        function reset() {
          chars.forEach(function (c) {
            c.classList.remove("on")
          })
          caret.className = "caret blink"
          caretAt(24)
          caretColor(0)
        }
        function showAll() {
          chars.forEach(function (c) {
            c.classList.add("on")
          })
          caret.className = "caret off"
        }

        async function play() {
          var id = ++run
          clearTimeout(timer)
          reset()
          var k = parseFloat(speed.value)
          await wait(900 * k)
          for (var i = 0; i < 8; i++) {
            if (id !== run) return
            chars[i].classList.add("on")
            caret.classList.remove("blink")
            caretAt(inkEnd[i] + 18)
            caretColor(i)
            // 打鍵リズム: 基本間隔にばらつきを持たせ、"Sky" と "share" の間で一拍置く
            var gap = 150 + Math.random() * 130
            if (i === 2) gap += 260
            if (i === 7) gap = 0
            await wait(gap * k)
            if (id !== run) return
            // 打鍵直後だけキャレットを点灯したままにして、次の文字までの間はそのまま
          }
          caret.classList.add("blink")
          await wait(2200 * k)
          if (id !== run) return
          if (loop.checked) {
            caret.classList.add("off")
            await wait(500)
            if (id === run) play()
          }
        }

        document.getElementById("play").addEventListener("click", play)
        document.getElementById("bg").addEventListener("change", function (e) {
          document.getElementById("stage").dataset.bg = e.target.value
        })
        function toggleBar() {
          document.body.classList.toggle("clean")
        }
        document.getElementById("hide").addEventListener("click", function (e) {
          e.stopPropagation()
          toggleBar()
        })
        document.getElementById("stage").addEventListener("click", function () {
          if (document.body.classList.contains("clean")) toggleBar()
        })
        document.addEventListener("keydown", function (e) {
          var t = e.target && e.target.tagName
          if (t === "SELECT" || t === "INPUT") return
          if (e.key === "h" || e.key === "H") toggleBar()
          if (e.key === " " || e.key === "Enter") {
            if (t !== "BUTTON") {
              e.preventDefault()
              play()
            }
          }
        })

        if (reduce) {
          showAll()
        } else {
          play()
        }
      })()
    </script>
